<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decisions - Jack Kane</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; line-height: 1.4; color: #1c1c1e; background-color: #ffffff; }

    .container {
      max-width: 1000px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr;
      gap: 60px; padding: 60px 20px;
    }
    .sidebar { position: sticky; top: 60px; height: fit-content; }

    .name {
      font-family: 'Source Serif Pro', serif;
      font-size: 2.2rem; font-weight: 500;
      color: #1c1c1e; line-height: 1.1;
      text-decoration: none; display: block;
      margin-bottom: 8px;
    }
    .name:hover { color: #059669; }

    .nav-links { list-style: none; margin-bottom: 30px; }
    .nav-links li { margin-bottom: 8px; }
    .nav-links a {
      color: #8e8e93; text-decoration: none;
      font-size: 0.95rem; line-height: 1.3;
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: #059669; }
    .nav-links a.current { color: #059669; font-weight: 500; }

    .contact-info { font-size: 0.9rem; color: #8e8e93; line-height: 1.4; }
    .contact-info a { color: #059669; text-decoration: none; }

    .main-content { padding-top: 20px; }

    .terminal-container {
      background-color: #0c0c0c; border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      min-height: 600px; max-height: 80vh;
      overflow-y: auto;
    }
    .terminal-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px; padding-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }
    .terminal-title { color: #8e8e93; font-size: 0.85rem; margin-left: 8px; }

    .terminal-output {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem; line-height: 1.3;
      color: #00ff00;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .terminal-input-line { display: flex; align-items: center; margin-top: 8px; }
    .terminal-prompt { color: #00ff00; margin-right: 8px; font-family: 'Courier New', monospace; }
    .terminal-input {
      flex: 1;
      background: transparent; border: none; outline: none;
      color: #00ff00; caret-color: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
    }

    @media (max-width: 768px), (pointer: coarse) {
      body { background-color: #0c0c0c; }
      .container {
        grid-template-columns: 1fr;
        gap: 0;
        padding: 0;
        max-width: none;
      }
      .sidebar { display: none; }
      .main-content { padding-top: 0; }
      .terminal-container {
        min-height: 100vh;
        min-height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
        padding: 16px;
      }
      /* 16px prevents iOS Safari from auto-zooming when the input is focused */
      .terminal-input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="main-content">
      <div class="terminal-container">
        <div class="terminal-header">
          <div class="terminal-dot dot-red"></div>
          <div class="terminal-dot dot-yellow"></div>
          <div class="terminal-dot dot-green"></div>
          <div class="terminal-title">decisions.py</div>
        </div>
        <div id="terminal-output" class="terminal-output"></div>
        <div class="terminal-input-line" id="input-line" style="display: none;">
          <span class="terminal-prompt">&gt;</span>
          <input type="text" id="terminal-input" class="terminal-input" autocomplete="off">
        </div>
      </div>
    </main>
  </div>
</body>
</html>

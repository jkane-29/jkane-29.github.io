<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decisions - Jack Kane</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.4;
            color: #374151;
            background-color: #fefefe;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 60px;
            padding: 60px 20px;
        }

        .sidebar {
            position: sticky;
            top: 60px;
            height: fit-content;
        }

        .name {
            font-family: 'Source Serif Pro', serif;
            font-size: 2.2rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #111827;
            line-height: 1.1;
            text-decoration: none;
            display: block;
        }

        .name:hover {
            color: #059669;
        }

        .title {
            color: #059669;
            font-weight: 500;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.2;
        }

        .nav-links {
            list-style: none;
            margin-bottom: 30px;
        }

        .nav-links li {
            margin-bottom: 8px;
        }

        .nav-links a {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            line-height: 1.3;
        }

        .nav-links a:hover {
            color: #059669;
        }

        .nav-links a.current {
            color: #059669;
            font-weight: 500;
        }

        .contact-info {
            font-size: 0.9rem;
            color: #6b7280;
            line-height: 1.4;
        }

        .contact-info a {
            color: #059669;
            text-decoration: none;
        }

        .main-content {
            padding-top: 20px;
        }

        .terminal-container {
            background-color: #0c0c0c;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-height: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .terminal-title {
            color: #a0a0a0;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        .terminal-output {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #00ff00;
            line-height: 1.3;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .terminal-input-line {
            display: flex;
            align-items: center;
            margin-top: 8px;
        }

        .terminal-prompt {
            color: #00ff00;
            margin-right: 8px;
            font-family: 'Courier New', Courier, monospace;
        }

        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            outline: none;
            caret-color: #00ff00;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #047857;
        }

        .btn:disabled {
            background-color: #6b7280;
            cursor: not-allowed;
        }

        .loading-message {
            color: #a0a0a0;
            font-size: 0.85rem;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 30px 20px;
            }
            
            .sidebar {
                position: static;
                border-bottom: 1px solid #e5e7eb;
                padding-bottom: 20px;
            }
            
            .name {
                font-size: 1.8rem;
            }

            .terminal-container {
                max-height: 70vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="index.html" class="name">Jack Kane</a>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="ideas.html">Ideas</a></li>
                    <li><a href="bookshelf.html">Bookshelf</a></li>
                    <li><a href="writing.html">Writing</a></li>
                    <li><a href="woodshop.html">Woodshop</a></li>
                    <li><a href="decisions.html" class="current">Decisions</a></li>
                </ul>
            </nav>
            
            <div class="contact-info">
                <p><a href="mailto:jkane29@icloud.com">jkane29@icloud.com</a></p>
                <p><a href="https://twitter.com/desperad0V" target="_blank">@desperad0V</a></p>
                <p>Office: N/A</p>
            </div>
        </aside>

        <main class="main-content">
            <div class="terminal-container">
                <div class="terminal-header">
                    <div class="terminal-dot dot-red"></div>
                    <div class="terminal-dot dot-yellow"></div>
                    <div class="terminal-dot dot-green"></div>
                    <div class="terminal-title">decisions.py</div>
                </div>
                <div id="terminal-output" class="terminal-output">Loading Python environment...</div>
                <div class="terminal-input-line" id="input-line" style="display: none;">
                    <span class="terminal-prompt">></span>
                    <input type="text" id="terminal-input" class="terminal-input" autocomplete="off">
                </div>
            </div>
        </main>
    </div>

    <script type="text/javascript">
        let inputResolver = null;
        let isWaitingForInput = false;
        let outputLines = [];
        const MAX_LINES = 15; // Keep last 15 lines visible

        function appendOutput(text) {
            const lines = text.split('\n');
            for (let line of lines) {
                if (line !== '') {
                    outputLines.push(line);
                } else {
                    outputLines.push(''); // Keep empty lines for spacing
                }
            }
            
            // Keep only the last MAX_LINES
            if (outputLines.length > MAX_LINES) {
                outputLines = outputLines.slice(-MAX_LINES);
            }
            
            const output = document.getElementById('terminal-output');
            output.textContent = outputLines.join('\n');
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            outputLines = [];
            const output = document.getElementById('terminal-output');
            if (output) {
                output.textContent = '';
            }
        }

        async function getInput(prompt = '') {
            if (prompt) {
                appendOutput(prompt);
            }
            
            isWaitingForInput = true;
            const inputLine = document.getElementById('input-line');
            const inputField = document.getElementById('terminal-input');
            
            inputLine.style.display = 'flex';
            inputField.value = '';
            inputField.focus();
            
            return new Promise((resolve) => {
                inputResolver = resolve;
            });
        }

        function handleInputSubmit() {
            if (!isWaitingForInput || !inputResolver) return;
            
            const inputField = document.getElementById('terminal-input');
            const value = inputField.value;
            
            appendOutput(value + '\n');
            
            inputField.value = '';
            document.getElementById('input-line').style.display = 'none';
            
            isWaitingForInput = false;
            const resolver = inputResolver;
            inputResolver = null;
            resolver(value);
        }

        document.getElementById('terminal-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleInputSubmit();
            }
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function runDecisionMaker() {
            try {
                console.log('runDecisionMaker called');
                clearOutput();
                
                // Get number of decision makers
                let numPeople;
                while (true) {
                    const input = await getInput("Enter # of decision makers: ");
                    numPeople = parseInt(input);
                    if (!isNaN(numPeople) && numPeople > 0) {
                        break;
                    }
                    appendOutput("Please enter a positive number.\n");
                }
                
                // Get number of options
                let numOptions;
                while (true) {
                    const input = await getInput("Enter # of options deciding between: ");
                    numOptions = parseInt(input);
                    if (!isNaN(numOptions) && numOptions > 1) {
                        break;
                    }
                    appendOutput("Please enter at least 2 options.\n");
                }
                
                // Get option names
                const options = [];
                appendOutput("Enter the name of each option:\n");
                for (let i = 0; i < numOptions; i++) {
                    const option = await getInput(`Option ${i + 1}: `);
                    options.push(option.trim());
                }
                
                // Create list of people (Person 1, Person 2, etc.)
                const people = [];
                for (let i = 0; i < numPeople; i++) {
                    people.push(`Person ${i + 1}`);
                }
                
                // Shuffle people for random starting order
                shuffleArray(people);
                
                // Start elimination process
                appendOutput("\n" + "=".repeat(50) + "\n");
                appendOutput("ELIMINATION PROCESS\n");
                appendOutput("=".repeat(50) + "\n");
                appendOutput(`Turn order: ${people.join(' → ')}\n`);
                
                let roundNum = 1;
                let personIndex = 0;
                
                while (options.length > 1) {
                    appendOutput(`\nRound ${roundNum}\n`);
                    appendOutput(`Remaining options: ${options.join(', ')}\n`);
                    
                    // Select current person from rotation
                    const currentPerson = people[personIndex];
                    appendOutput(`\n${currentPerson}'s turn!\n`);
                    appendOutput("Choose the option you want to ELIMINATE:\n");
                    
                    // Display options with numbers
                    for (let i = 0; i < options.length; i++) {
                        appendOutput(`  ${i + 1}. ${options[i]}\n`);
                    }
                    
                    // Get elimination choice
                    let choice;
                    while (true) {
                        const input = await getInput(`\nEnter number (1-${options.length}): `);
                        choice = parseInt(input);
                        if (!isNaN(choice) && choice >= 1 && choice <= options.length) {
                            break;
                        }
                        appendOutput(`Please enter a number between 1 and ${options.length}.\n`);
                    }
                    
                    // Remove chosen option
                    const eliminated = options.splice(choice - 1, 1)[0];
                    appendOutput(`\n${eliminated} has been eliminated!\n`);
                    
                    // Move to next person in rotation
                    personIndex = (personIndex + 1) % numPeople;
                    roundNum++;
                }
                
                // Announce winner
                appendOutput("\n" + "=".repeat(50) + "\n");
                appendOutput("FINAL DECISION\n");
                appendOutput("=".repeat(50) + "\n");
                appendOutput(`\nThe group has chosen: ${options[0]}\n`);
                
                // ASCII art celebration
                const winnerName = options[0].substring(0, 50); // Truncate if too long
                const trophyArt = `

       .-.,     ,.-.
 '-.  /:::\\   //:::\\  .-'
 '-.\\|':':' \`"\` ':':'|/.-'
 \`-./\`. .-=-. .-=-. .\`\\.-\`
   /=- /     |     \\ -=\\
  ;   |      |      |   ;
  |=-.|______|______|.-=|
  |==  \\  0 /_\\ 0  /  ==|
  |=   /'---( )---'\\   =|
   \\   \\:   .'.   :/   /
    \`\\= '--\`   \`--' =/'
      \`-=._     _.=-'
           \`""\`\`
`;
                // Center the winner name in a 35-character space
                const paddedName = winnerName.length <= 35 
                    ? winnerName.padStart(Math.floor((35 + winnerName.length) / 2)).padEnd(35)
                    : winnerName.substring(0, 35);
                
                // Create text box lines (without the outer padding)
                const textBoxLines = [
                    '═'.repeat(45),
                    '╔═══════════════════════════════════════╗',
                    '║                                       ║',
                    '║      THE ULTIMATE DECISION            ║',
                    '║                                       ║',
                    `║  ${paddedName}  ║`,
                    '║                                       ║',
                    '╚═══════════════════════════════════════╝',
                    '═'.repeat(45)
                ];
                
                appendOutput("\n\n");
                // Keep all lines including empty ones to preserve structure
                const trophyLines = trophyArt.split('\n');
                
                // Combine trophy art and text box side by side
                const maxLines = Math.max(trophyLines.length, textBoxLines.length);
                const combinedLines = [];
                
                for (let i = 0; i < maxLines; i++) {
                    const trophyLine = i < trophyLines.length ? trophyLines[i] : '';
                    const textBoxLine = i < textBoxLines.length ? textBoxLines[i] : '';
                    // Pad trophy line to consistent width (about 50 chars) then add text box
                    const paddedTrophy = trophyLine.padEnd(50);
                    combinedLines.push(paddedTrophy + '  ' + textBoxLine);
                }
                
                // Output all lines at once, bypassing line limit for ASCII art
                const output = document.getElementById('terminal-output');
                const fullOutput = outputLines.join('\n') + '\n\n' + combinedLines.join('\n') + '\n' + "=".repeat(50) + '\n';
                outputLines = fullOutput.split('\n');
                // Keep more lines for ASCII art display
                if (outputLines.length > 50) {
                    outputLines = outputLines.slice(-50);
                }
                output.textContent = outputLines.join('\n');
                output.scrollTop = output.scrollHeight;
                
                // Wait 7 seconds then restart
                await new Promise(resolve => setTimeout(resolve, 7000));
                runDecisionMaker();
                
            } catch (err) {
                appendOutput('\n\nError: ' + err.message + '\n');
                appendOutput('Stack: ' + err.stack + '\n');
                console.error('Error in runDecisionMaker:', err);
            }
        }

        // Auto-start when page loads
        (function() {
            console.log('Initializing decisions app, readyState:', document.readyState);
            function startApp() {
                console.log('Starting runDecisionMaker');
                runDecisionMaker().catch(err => {
                    console.error('Unhandled error:', err);
                    const output = document.getElementById('terminal-output');
                    if (output) {
                        output.textContent = 'Error: ' + err.message;
                    }
                });
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    setTimeout(startApp, 50);
                });
            } else {
                setTimeout(startApp, 50);
            }
        })();
    </script>
</body>
</html>

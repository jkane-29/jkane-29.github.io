        * {

            padding: 0;

        body {

            line-height: 1.4;

        .container {

            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 60px;
            padding: 60px 20px;
        }

        .sidebar {
            position: sticky;
            top: 60px;
            height: fit-content;
        }

        .name {
            font-family: 'Source Serif Pro', serif;
            font-size: 2.2rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #111827;
            line-height: 1.1;
            text-decoration: none;
            display: block;
        }

        .name:hover {
            color: #059669;
        }

        .title {
            color: #059669;
            font-weight: 500;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.2;
        }

        .nav-links {
            list-style: none;
            margin-bottom: 30px;
        }

        .nav-links li {
            margin-bottom: 8px;
        }

        .nav-links a {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            line-height: 1.3;
        }

        .nav-links a:hover {
            color: #059669;
        }

        .nav-links a.current {
            color: #059669;
            font-weight: 500;
        }

        .contact-info {
            font-size: 0.9rem;
            color: #6b7280;
            line-height: 1.4;
        }

        .contact-info a {
            color: #059669;
            text-decoration: none;
        }

        .main-content {
            padding-top: 20px;
        }

        .gallery-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0;
            background: none;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            border: none;
        }

        .gallery-frame {
            position: relative;
            width: 100%;
            height: 80vh;
            background: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
        }

        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .gallery-image.active {
            opacity: 1;
        }

        .gallery-controls {
            display: none;
        }

        .gallery-progress {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 30px 20px;
            }
            
            .sidebar {
                position: static;
                border-bottom: 1px solid #e5e7eb;
                padding-bottom: 20px;
            }
            
            .name {
                font-size: 1.8rem;
            }

            .gallery-frame {
                height: 70vh;
            }

            .gallery-progress {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="index.html" class="name">John Kane</a>
            
            <nav>
                <ul class="nav-links">

                    <li><a href="reading.html">Reading</a></li>
                    <li><a href="writing.html">Writing</a></li>
                    <li><a href="woodshop.html">Woodshop</a></li>
                    <li><a href="gallery.html" class="current">Gallery</a></li>

            </nav>
            
            <div class="contact-info">
                <p><a href="mailto:jkane29@icloud.com">jkane29@icloud.com</a></p>
                <p><a href="https://twitter.com/desperad0V" target="_blank">@desperad0V</a></p>
                <p>Office: N/A</p>
            </div>
        </aside>

        <main class="main-content">
            <div class="gallery-container">
                <div class="gallery-progress" style="display: none;"></div>
                <div class="gallery-frame">
                </div>
                <div class="gallery-controls" id="gallery-controls" style="display: none;"></div>
            </div>
        </main>
    </div>

    <script>
        class Gallery {
            constructor() {
                this.images = [];
                this.currentIndex = 0;
                this.intervalId = null;
                this.progressId = null;
                this.cycleTime = 30000; // 30 seconds
                
                this.frame = document.querySelector('.gallery-frame');
                this.titleElement = document.getElementById('image-title');
                this.metaElement = document.getElementById('image-meta');
                this.descriptionElement = document.getElementById('image-description');
                this.controlsContainer = document.getElementById('gallery-controls');
                this.progressBar = document.querySelector('.gallery-progress');
                this.placeholderMessage = document.getElementById('placeholder-message');
                
                this.init();
            }

            async init() {
                await this.loadImages();
                if (this.images.length > 0) {
                    this.setupGallery();
                    this.startSlideshow();
                }
            }

                        meta: 'Sample • 2024',
                        description: 'Second sample placeholder image'
                    },
                    {
                        src: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAwIiBoZWlnaHQ9IjYwMCIgdmlld0JveD0iMCAwIDgwMCA2MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSI4MDAiIGhlaWdodD0iNjAwIiBmaWxsPSIjZmVmM2M3Ii8+CjxjaXJjbGUgY3g9IjQwMCIgY3k9IjMwMCIgcj0iMTUwIiBmaWxsPSIjZmJiZjI0Ii8+Cjx0ZXh0IHg9IjQwMCIgeT0iMzEwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNzkyYzExIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMjQiPkdhbGxlcnkgSW1hZ2UgMzwvdGV4dD4KPC9zdmc+',

                        meta: 'Sample • 2024',
                        description: 'Third sample placeholder image'

                // Filter and load images that actually exist
                for (const data of imageData) {
                    try {
                        await this.checkImageExists(data.src);
                        this.images.push(data);
                    } catch (error) {
                        console.log(`Image not found: ${data.src}`);
                    }
                }
            }

            checkImageExists(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(src);
                    img.onerror = () => reject(src);
                    img.src = src;
                });
            }

            setupGallery() {
                // Create image elements
                this.images.forEach((imageData, index) => {
                    const img = document.createElement('img');
                    img.src = imageData.src;
                    img.alt = imageData.title;
                    img.className = 'gallery-image';
                    if (index === 0) img.classList.add('active');
                    this.frame.appendChild(img);
                });
            }

            goToSlide(index) {
                // Update active image
                document.querySelectorAll('.gallery-image').forEach((img, i) => {
                    img.classList.toggle('active', i === index);
                });
                
                this.currentIndex = index;
                this.resetProgress();
            }

            nextSlide() {
                const nextIndex = (this.currentIndex + 1) % this.images.length;
                this.goToSlide(nextIndex);
            }

            startSlideshow() {
                if (this.images.length <= 1) return;
                
                this.intervalId = setInterval(() => {
                    this.nextSlide();
                }, this.cycleTime);

                this.startProgress();
            }

            startProgress() {
                let progress = 0;
                const increment = 100 / (this.cycleTime / 100);
                
                this.progressId = setInterval(() => {
                    progress += increment;
                    this.progressBar.style.width = `${Math.min(progress, 100)}%`;
                    
                    if (progress >= 100) {
                        progress = 0;
                    }
                }, 100);
            }

            resetProgress() {
                if (this.progressId) {
                    clearInterval(this.progressId);
                }
                this.progressBar.style.width = '0%';
                this.startProgress();
            }

            pauseSlideshow() {
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
                if (this.progressId) {
                    clearInterval(this.progressId);
                    this.progressId = null;
                }
            }

            resumeSlideshow() {
                this.startSlideshow();
            }
        }

        // Initialize gallery when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const gallery = new Gallery();

            // Pause on hover, resume on mouse leave
            const galleryContainer = document.querySelector('.gallery-container');
            galleryContainer.addEventListener('mouseenter', () => {
                gallery.pauseSlideshow();
            });
            
            galleryContainer.addEventListener('mouseleave', () => {
                gallery.resumeSlideshow();
            });
        });
    </script>
</body>

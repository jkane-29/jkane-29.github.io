<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - John Kane</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.4;
            color: #374151;
            background-color: #fefefe;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 60px;
            padding: 60px 20px;
        }

        .sidebar {
            position: sticky;
            top: 60px;
            height: fit-content;
        }

        .name {
            font-family: 'Source Serif Pro', serif;
            font-size: 2.2rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #111827;
            line-height: 1.1;
            text-decoration: none;
            display: block;
        }

        .name:hover {
            color: #059669;
        }

        .title {
            color: #059669;
            font-weight: 500;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.2;
        }

        .nav-links {
            list-style: none;
            margin-bottom: 30px;
        }

        .nav-links li {
            margin-bottom: 8px;
        }

        .nav-links a {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            line-height: 1.3;
        }

        .nav-links a:hover {
            color: #059669;
        }

        .nav-links a.current {
            color: #059669;
            font-weight: 500;
        }

        .contact-info {
            font-size: 0.9rem;
            color: #6b7280;
            line-height: 1.4;
        }

        .contact-info a {
            color: #059669;
            text-decoration: none;
        }

        .main-content {
            padding-top: 0;
        }

        .gallery-container {
            position: relative;
            margin: 0;
            background: none;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            border: none;
        }

        .gallery-frame {
            position: relative;
            height: 80vh;
            background: none;
            display: block;
            padding: 0;
        }

        .gallery-image {
            position: absolute;
            height: auto;
            object-fit: contain;
            left: 50%;
            width: auto;
            min-width: 200px;
            max-width: 90%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            z-index: 1;
        }

        .gallery-image.active {
            opacity: 1;
            z-index: 2;
        }

        .gallery-controls {
            display: none;
        }

        .gallery-progress {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 30px 20px;
            }
            
            .sidebar {
                position: static;
                border-bottom: 1px solid #e5e7eb;
                padding-bottom: 20px;
            }
            
            .name {
                font-size: 1.8rem;
            }

            .gallery-frame {
                height: 70vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="index.html" class="name">John Kane</a>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="ideas.html">Ideas</a></li>
                    <li><a href="reading.html">Reading</a></li>
                    <li><a href="writing.html">Writing</a></li>
                    <li><a href="woodshop.html">Woodshop</a></li>
                    <li><a href="gallery.html" class="current">Gallery</a></li>
                </ul>
            </nav>
            
            <div class="contact-info">
                <p><a href="mailto:jkane29@icloud.com">jkane29@icloud.com</a></p>
                <p><a href="https://twitter.com/desperad0V" target="_blank">@desperad0V</a></p>
                <p>Office: N/A</p>
            </div>
        </aside>

        <main class="main-content">
            <div class="gallery-container">
                <div class="gallery-progress"></div>
                <div class="gallery-frame">
                </div>
                <div class="gallery-controls" id="gallery-controls" style="display: none;"></div>
            </div>
        </main>
    </div>

    <script>
        class Gallery {
            constructor() {
                this.images = [];
                this.currentIndex = 0;
                this.intervalId = null;
                this.progressId = null;
                this.cycleTime = 20000; // 20 seconds
                
                this.frame = document.querySelector('.gallery-frame');
                this.controlsContainer = document.getElementById('gallery-controls');
                this.progressBar = document.querySelector('.gallery-progress');
                
                console.log('Gallery constructor called');
                this.init();
            }

            init() {
                console.log('Gallery init called');
                this.loadImages();
                this.setupGallery();
                this.startSlideshow();
            }

            loadImages() {
                // Art images from essays/Gallery/ directory with proper URL encoding
                this.images = [
                    {
                        src: 'essays/Gallery/Adelita,%20Alfredo%20Arreguin.jpeg'
                    },
                    {
                        src: 'essays/Gallery/Black%20Cross%20New%20Mexico,%20Georgia%20O%27Keeffe.jpg'
                    },
                    {
                        src: 'essays/Gallery/Cosmic%20Cities,%20Arthur%20Wesley%20Dow.jpg'
                    },
                    {
                        src: 'essays/Gallery/Landscape%20No.%203%20Marsden%20Hartley.jpg'
                    },
                    {
                        src: 'essays/Gallery/Landscape%20with%20Threee%20Trees,%20Richard%20Diebenkorn.jpeg'
                    },
                    {
                        src: 'essays/Gallery/Salish%20Sea,%20Alfredo%20Arreguin.jpg'
                    },
                    {
                        src: 'essays/Gallery/Signs,%20Lee%20Friedlander.jpg'
                    },
                    {
                        src: 'essays/Gallery/Summer%20in%20the%20Catskills,%20George%20Inness.jpg'
                    },
                    {
                        src: 'essays/Gallery/The%20Executive%20Apartment,%20Lynne%20Cohen.jpg'
                    },
                    {
                        src: 'essays/Gallery/The%20Monk,%20George%20Inness.jpg'
                    }
                ];
                
                console.log(`Loaded ${this.images.length} images`);
            }

            setupGallery() {
                console.log('Setting up gallery...');
                
                // Create image elements
                this.images.forEach((imageData, index) => {
                    const img = document.createElement('img');
                    img.src = imageData.src;
                    img.alt = `Gallery image ${index + 1}`;
                    img.className = 'gallery-image';
                    if (index === 0) img.classList.add('active');
                    
                    // Add load/error event listeners for debugging
                    img.onload = () => console.log(`Image ${index + 1} loaded`);
                    img.onerror = () => console.log(`Image ${index + 1} failed to load: ${imageData.src}`);
                    
                    this.frame.appendChild(img);
                });

                console.log('Gallery setup complete');
            }

            goToSlide(index) {
                console.log(`Going to slide ${index}`);
                
                // Update active image
                document.querySelectorAll('.gallery-image').forEach((img, i) => {
                    img.classList.toggle('active', i === index);
                });
                
                this.currentIndex = index;
                this.resetProgress();
            }

            nextSlide() {
                const nextIndex = (this.currentIndex + 1) % this.images.length;
                console.log(`Next slide: ${nextIndex} (current: ${this.currentIndex})`);
                this.goToSlide(nextIndex);
            }

            startSlideshow() {
                console.log(`Starting slideshow with ${this.images.length} images`);
                if (this.images.length <= 1) {
                    console.log('Not enough images for slideshow');
                    return;
                }
                
                console.log('Starting slideshow...');
                this.intervalId = setInterval(() => {
                    console.log('Interval triggered - calling nextSlide');
                    this.nextSlide();
                }, this.cycleTime);

                this.startProgress();
                console.log(`Slideshow started with ${this.cycleTime}ms interval`);
            }

            startProgress() {
                let progress = 0;
                const increment = 100 / (this.cycleTime / 100);
                
                this.progressId = setInterval(() => {
                    progress += increment;
                    this.progressBar.style.width = `${Math.min(progress, 100)}%`;
                    
                    if (progress >= 100) {
                        progress = 0;
                    }
                }, 100);
            }

            resetProgress() {
                if (this.progressId) {
                    clearInterval(this.progressId);
                }
                this.progressBar.style.width = '0%';
                this.startProgress();
            }

            pauseSlideshow() {
                console.log('Pausing slideshow');
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
                if (this.progressId) {
                    clearInterval(this.progressId);
                    this.progressId = null;
                }
            }

            resumeSlideshow() {
                console.log('Resuming slideshow');
                this.startSlideshow();
            }
        }

        // Initialize gallery when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing gallery...');
            const gallery = new Gallery();

            // Pause on hover, resume on mouse leave
            const galleryContainer = document.querySelector('.gallery-container');
            galleryContainer.addEventListener('mouseenter', () => {
                gallery.pauseSlideshow();
            });
            
            galleryContainer.addEventListener('mouseleave', () => {
                gallery.resumeSlideshow();
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Rides Chi</title>
  <meta name="description" content="Chicagoland's best bike rides: how far, how much traffic, and the nearest train.">
  <!-- Ride details embed RideWithGPS; warm the connection before anyone clicks -->
  <link rel="preconnect" href="https://ridewithgps.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    /* Red for routes, stars and the main action; flag blue only in the header stripe;
       CTA lines keep their own colors; Metra and South Shore are one color each.
       Everything else is ink and gray. */
    :root {
      --paper:  #ffffff;
      --ink:    #14181f;
      --mid:    #636a75;
      --faint:  #a3a9b2;
      --line:   #e6e8ec;
      --hover:  #f4f5f7;
      --red:    #e4002b;   /* Chicago flag red */
      --flag:   #41b6e6;   /* Chicago flag light blue */
      --mapbg:  #eceef1;
      --display: "Archivo", ui-sans-serif, system-ui, -apple-system, sans-serif;   /* names and numbers */
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --head: 56px;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    html { scrollbar-gutter: stable; }
    body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    body:has(dialog[open]), body[data-view="map"] { overflow: hidden; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100; height: var(--head); padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: var(--paper);
    }
    /* Chicago flag stripe */
    header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 6px;
                    background: linear-gradient(var(--flag) 0 2px, var(--paper) 2px 4px, var(--flag) 4px 6px); }
    .site-title { font: 800 18px var(--display); font-stretch: 118%; letter-spacing: -0.01em; text-decoration: none; white-space: nowrap; }
    .stars { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: 2px; }
    .stars svg { fill: var(--red); }
    nav { display: flex; gap: 4px; }
    nav a { color: var(--mid); text-decoration: none; padding: 6px 12px; border-radius: 999px; transition: color .12s, background-color .12s; }
    nav a:hover { color: var(--ink); }
    nav a[aria-current="page"] { color: var(--ink); background: var(--hover); font-weight: 600; }
    @media (max-width: 640px) { header { padding: 0 16px; } }

    main { max-width: 860px; margin: 0 auto; padding: 32px 24px 64px; }

    /* ── Filters ── */
    .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 12px; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      font-size: 14px; color: var(--mid); background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 14px; cursor: pointer; transition: color .12s, background-color .12s, border-color .12s;
    }
    .pill:hover { color: var(--ink); border-color: var(--faint); }
    .pill.on { color: var(--paper); background: var(--ink); border-color: var(--ink); }

    /* ── Ride list: name and miles. Traffic and train are filters, and live in the detail ── */
    .ride {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: baseline;
      padding: 16px 12px; margin: 0 -12px; border-bottom: 1px solid var(--line);
      text-decoration: none; cursor: pointer; transition: background-color .12s;
    }
    .ride:hover { background: var(--hover); }
    .ride:focus-visible { outline-offset: -2px; }
    .name { font: 650 17px/1.3 var(--display); font-stretch: 104%; transition: color .1s; }
    .ride:hover .name { color: var(--red); }
    .mi { text-align: right; font: 700 22px/1.2 var(--display); }
    .unit { font-family: var(--sans); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
    .unit { font-size: 13px; font-weight: 400; color: var(--mid); margin-left: 3px; font-stretch: 100%; }
    .empty { padding: 40px 0; text-align: center; }
    footer { margin-top: 32px; font-size: 13px; }
    footer a { color: var(--mid); }
    footer a:hover { color: var(--ink); }

    @media (max-width: 640px) {
      main { padding: 20px 16px 48px; }
      .ride { padding: 14px 16px; margin: 0 -16px; }
    }

    /* ── Data notes ── */
    .data { max-width: 720px; }
    .data h2 { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
    .data table { width: 100%; border-collapse: collapse; margin-bottom: 32px; font-size: 14px; }
    .data th, .data td { text-align: left; vertical-align: top; padding: 10px 0; border-top: 1px solid var(--line); }
    .data th { width: 170px; font-weight: 600; padding-right: 16px; }
    .data td { line-height: 1.55; color: var(--mid); }
    .data a { color: var(--ink); }
    .data .stamp { color: var(--mid); font-size: 13px; }

    /* ── Ride detail (native dialog) ── */
    dialog#ride {
      width: min(94vw, 820px); max-width: none; max-height: 92vh; margin: auto; padding: 0;
      background: var(--paper); color: var(--ink); border: none; border-radius: 12px;
      box-shadow: 0 24px 70px rgba(20,24,31,0.35); overflow: hidden;
      opacity: 0; transform: translateY(10px) scale(.985);
      transition: opacity .2s var(--ease), transform .2s var(--ease), overlay .2s allow-discrete, display .2s allow-discrete;
    }
    dialog#ride[open] { display: flex; flex-direction: column; opacity: 1; transform: none; }
    @starting-style { dialog#ride[open] { opacity: 0; transform: translateY(10px) scale(.985); } }
    dialog#ride::backdrop { background: rgba(20,24,31,0); transition: background-color .2s, overlay .2s allow-discrete, display .2s allow-discrete; }
    dialog#ride[open]::backdrop { background: rgba(20,24,31,0.5); }
    @starting-style { dialog#ride[open]::backdrop { background: rgba(20,24,31,0); } }

    #modal-bar {
      height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 0 8px 0 20px; border-bottom: 1px solid var(--line);
    }
    #modal-title { font: 700 17px var(--display); font-stretch: 108%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #modal-close { border: none; background: none; font-size: 24px; line-height: 1; color: var(--mid); cursor: pointer; padding: 4px 10px; border-radius: 999px; }
    #modal-close:hover { color: var(--ink); background: var(--hover); }
    /* flex-basis auto, not flex: 1: the dialog has only a max-height, and Safari sizes a
       0-basis child of an indefinite-height column to nothing (just the title bar shows) */
    #modal-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
    /* RWGPS embed needs real height or its map falls back to a world view. Until it
       has loaded, the route itself is drawn here, so there's never a blank box. */
    #modal-map { height: 480px; position: relative; background: var(--mapbg); overflow: hidden; }
    #modal-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #modal-map .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s var(--ease) .05s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    #modal-map iframe { position: absolute; inset: 0; width: 1px; min-width: 100%; height: 100%; border: 0; display: block;
                        opacity: 0; transition: opacity .35s ease; }
    #modal-map iframe.ready { opacity: 1; }
    #modal-body { padding: 20px 24px 24px; }

    .variants { margin-bottom: 16px; }
    .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .facts div { font: 700 26px/1.2 var(--display); }
    .facts .unit { font-size: 14px; }
    .notes { margin-top: 18px; border-top: 1px solid var(--line); }
    .notes p { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .notes b { font-weight: 600; }
    .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .btn { font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 999px; text-decoration: none; border: 1px solid var(--line); cursor: pointer; transition: background-color .12s, border-color .12s; }
    .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.primary:hover { background: #c70026; border-color: #c70026; }
    .btn.secondary { background: var(--paper); color: var(--ink); }
    .btn.secondary:hover { background: var(--hover); }

    /* Phones: the detail is a sheet that rises from the bottom */
    @media (max-width: 640px) {
      dialog#ride { width: 100%; max-height: 92dvh; margin: auto 0 0; border-radius: 14px 14px 0 0; transform: translateY(40px); }
      @starting-style { dialog#ride[open] { opacity: 0; transform: translateY(40px); } }
      #modal-map { height: 400px; }
      #modal-body { padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); }
      .facts { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── Map view ── */
    #view-map { position: fixed; top: calc(var(--head) + 6px); left: 0; right: 0; bottom: 0; z-index: 0; isolation: isolate; background: var(--mapbg); }
    #map { position: absolute; inset: 0; background: var(--mapbg); }
    /* Grey base map so rides and transit lines read first */
    /* On the tiles, not the pane: Safari ignores a filter on the pane (its tiles are 3D-transformed) */
    #map .leaflet-tile { filter: grayscale(1) contrast(0.88) brightness(1.06); }
    #map .leaflet-control-attribution { font-size: 9px; opacity: 0.7; }
    #map .leaflet-tooltip { font: 12px var(--sans); }
    /* Vector layers hide while the map flies to a ride (see expand) */
    .leaflet-rideLines-pane, .leaflet-rideDots-pane, .leaflet-transit-pane { transition: opacity 0.3s ease; }
    /* With a ride open, transit steps back so the red route reads first */
    .picked .leaflet-transit-pane { opacity: .4; }
    .flying .leaflet-rideLines-pane, .flying .leaflet-rideDots-pane, .flying .leaflet-transit-pane { opacity: 0; transition: none; }

    .map-toggles { position: absolute; top: 10px; left: 54px; z-index: 500; display: flex; gap: 6px; }
    .map-toggles .pill { box-shadow: 0 1px 4px rgba(20,24,31,.12); padding: 5px 12px; }

    #legend {
      position: absolute; bottom: 28px; left: 16px; z-index: 500; display: flex; gap: 14px;
      background: var(--paper); border-radius: 999px; box-shadow: 0 1px 4px rgba(20,24,31,.12);
      padding: 6px 14px; font-size: 13px;
    }
    #legend[hidden] { display: none; }
    .legend-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .legend-line { width: 18px; height: 4px; border-radius: 2px; background: var(--c); }

    #ride-card {
      position: absolute; top: 16px; right: 16px; z-index: 600; width: 330px;
      background: var(--paper); border-radius: 12px; box-shadow: 0 10px 30px rgba(20,24,31,0.22);
      padding: 16px 18px; max-height: calc(100% - 32px); overflow-y: auto;
      opacity: 0; transform: translateY(-6px); pointer-events: none; visibility: hidden;
      transition: opacity .18s var(--ease), transform .18s var(--ease), visibility 0s .18s;
    }
    #ride-card.open { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .18s var(--ease), transform .18s var(--ease); }
    .card-close { position: absolute; top: 8px; right: 8px; cursor: pointer; font-size: 20px; line-height: 1; color: var(--mid); background: none; border: none; padding: 4px 8px; border-radius: 999px; }
    .card-close:hover { color: var(--ink); background: var(--hover); }
    .card-name { font: 700 18px/1.3 var(--display); margin-bottom: 4px; padding-right: 24px; }
    .card-mi { font: 700 22px/1.2 var(--display); }
    .card-vars { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .card-vars .pill { font-size: 13px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; }
    .var-dash { width: 16px; border-top: 2px dashed currentColor; }
    .pill.primary .var-dash { border-top: 3px solid var(--red); }
    .card-links { margin-top: 14px; display: flex; gap: 8px; }
    .card-links .btn { font-size: 13px; padding: 6px 12px; }
    @media (max-width: 640px) {
      #ride-card { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; max-height: 55%; transform: translateY(8px); }
      #view-map:has(#ride-card.open) #legend { display: none; }
    }

    /* ── Motion ── */
    ::view-transition-group(*) { animation-duration: .26s; animation-timing-function: var(--ease); }
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .16s; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after, ::backdrop { transition-duration: 0s !important; animation-duration: 0s !important; }
      #modal-map .draw { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body data-view="rides">
<!-- Chicago flag star, used in the title -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="star" viewBox="-6.5 -6.5 13 13"><path d="M0 -6L1.2 -2.08L5.2 -3L2.4 0L5.2 3L1.2 2.08L0 6L-1.2 2.08L-5.2 3L-2.4 0L-5.2 -3L-1.2 -2.08Z"/></symbol></svg>

<header>
  <a class="site-title" href="#">Best Rides Chi<span class="stars"><svg width="9" height="9" aria-hidden="true"><use href="#star"/></svg><svg width="9" height="9" aria-hidden="true"><use href="#star"/></svg><svg width="9" height="9" aria-hidden="true"><use href="#star"/></svg><svg width="9" height="9" aria-hidden="true"><use href="#star"/></svg></span></a>
  <nav id="nav" aria-label="Views">
    <a href="#" data-v="rides" aria-current="page">Rides</a>
    <a href="#map" data-v="map">Map</a>
  </nav>
</header>

<main>
  <section id="view-rides">
    <div class="controls">
      <div class="group" id="lengths" role="group" aria-label="Length"></div>
      <div class="group" id="filters" role="group" aria-label="Filters"></div>
    </div>
    <div id="rows"></div>
    <div class="empty" id="empty" hidden><button type="button" class="pill" id="clear">Show all rides</button></div>
    <footer><a href="#data">About the data</a></footer>
  </section>
  <section id="view-data" class="data" hidden></section>
</main>

<section id="view-map" hidden>
  <div id="map"></div>
  <div class="map-toggles">
    <button type="button" class="pill on" id="btn-rides" aria-pressed="true">Rides</button>
    <button type="button" class="pill" id="btn-transit" aria-pressed="false">Transit</button>
  </div>
  <div id="legend" hidden></div>
  <div id="ride-card" role="region" aria-label="Selected ride"><button type="button" class="card-close" id="card-close" aria-label="Close">×</button><div id="card-body"></div></div>
</section>

<dialog id="ride" aria-labelledby="modal-title">
  <div id="modal-bar"><span id="modal-title"></span><button type="button" id="modal-close" aria-label="Close">×</button></div>
  <div id="modal-scroll"><div id="modal-map"></div><div id="modal-body"></div></div>
</dialog>

<script src="data/rides.js"></script>
<script src="data/transit.js"></script>
<script>
/* Best Rides Chi — one page, three views, all state in the URL.
   #            ride list           #<ride>       list, with that ride's detail open
   #map         map                 #map/<ride>   map, with that ride selected
   #data        notes on the data
   ?len=short|mid|long&only=trail,train   list filters
   Data: RIDES (data/rides.js) and TRANSIT_LINES / BIKE_RULES (data/transit.js), both
   generated by tools/build_rides.py. */
const SYS = { cta: 'CTA', metra: 'Metra', southshore: 'South Shore' };
const BY_ID = Object.fromEntries(RIDES.map(r => [r.id, r]));
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ── How rides are described ─────────────────────────────────────────── */
const fmtMi = mi => mi >= 100 ? String(Math.round(mi)) : mi.toFixed(1);
const unit = (n, u) => `${n}<span class="unit">${u}</span>`;

// Station lines are short codes ("Red", "UP-NW", "South Shore"); say them the way riders do
const LINE = {};
TRANSIT_LINES.forEach(l => { LINE[l.sys === 'southshore' ? 'South Shore' : l.short] = l; });
// Riders know the CTA lines by color; Metra and South Shore lines by name, so those get one color per system
const SYS_COLOR = { metra: '#25408f', southshore: '#7a1f3d' };
const lineColor = l => SYS_COLOR[l.sys] || l.color;
function lineName(code) {
  const l = LINE[code];
  if (!l) return code;
  return l.sys === 'cta' ? l.name : l.sys === 'metra' ? `Metra ${code}` : SYS[l.sys];
}
const TRAIN_MAX = 5;   // mi; farther than this isn't "by train"
const startStation = v => { const s = (v.start.stations || [])[0]; return s && s.mi <= TRAIN_MAX ? s : null; };
const dot = code => `<i class="dot" style="--c:${LINE[code] ? lineColor(LINE[code]) : 'var(--faint)'}" aria-hidden="true"></i>`;

/* ── List state: lives in the URL query, so refresh / back / sharing keep it ── */
const LENGTHS = [
  ['any',   'Any length',  () => true],
  ['short', 'Under 20 mi', mi => mi < 20],
  ['mid',   '20–40 mi',    mi => mi >= 20 && mi < 40],
  ['long',  '40+ mi',      mi => mi >= 40],
];
const FILTERS = [
  ['trail', 'Trail',          v => v.comfort === 'trail'],   // build_rides.py: ≥70% off-street, <5% main roads
  ['train', 'Train to start', v => { const s = startStation(v); return !!s && s.mi <= 1; }],
];
const S = { len: 'any', only: new Set() };
(function readQuery() {
  const q = new URLSearchParams(location.search);
  if (LENGTHS.some(([k]) => k === q.get('len'))) S.len = q.get('len');
  (q.get('only') || '').split(',').forEach(k => { if (FILTERS.some(f => f[0] === k)) S.only.add(k); });
})();
function writeQuery() {
  const q = new URLSearchParams();
  if (S.len !== 'any') q.set('len', S.len);
  if (S.only.size) q.set('only', [...S.only].join(','));
  const qs = q.toString().replace(/%2C/g, ',');
  history.replaceState(history.state, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
}
const matches = r => {
  const v = r.variants[0];
  return LENGTHS.find(l => l[0] === S.len)[2](v.mi) && [...S.only].every(k => FILTERS.find(f => f[0] === k)[2](v));
};

/* ── List: rows are built once, then shown or hidden in place ────────── */
const rowEl = {};
function buildRow(r) {
  const v = r.variants[0];
  const a = document.createElement('a');
  a.className = 'ride'; a.href = '#' + r.id; a.dataset.id = r.id;
  a.innerHTML = `
    <div class="name">${r.name}</div>
    <div class="mi">${unit(Math.round(v.mi), 'mi')}</div>`;
  return a;
}
RIDES.forEach(r => { rowEl[r.id] = buildRow(r); $('rows').appendChild(rowEl[r.id]); });

$('lengths').innerHTML = LENGTHS.map(([k, l]) => `<button type="button" class="pill" data-len="${k}">${l}</button>`).join('');
$('filters').innerHTML = FILTERS.map(([k, l]) => `<button type="button" class="pill" data-f="${k}">${l}</button>`).join('');

function paintControls(shown) {
  $('lengths').querySelectorAll('.pill').forEach(b => { const on = b.dataset.len === S.len; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  $('filters').querySelectorAll('.pill').forEach(b => { const on = S.only.has(b.dataset.f); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  $('empty').hidden = shown > 0;
}

// Rows slide into place as filters change (View Transitions where supported)
function updateList(animate = true) {
  const show = new Set(RIDES.filter(matches).map(r => r.id));
  const apply = () => {
    for (const id in rowEl) rowEl[id].hidden = !show.has(id);
    paintControls(show.size);
  };
  const named = animate && document.startViewTransition && !STILL && view === 'rides'
    ? Object.values(rowEl).filter(el => !el.hidden || show.has(el.dataset.id)) : [];
  named.forEach(el => { el.style.viewTransitionName = 'r-' + el.dataset.id; });
  const t = named.length ? document.startViewTransition(apply) : (apply(), null);
  if (t) {
    t.ready.catch(() => {});   // a quick second click interrupts the first animation; that's fine
    t.finished.finally(() => named.forEach(el => { el.style.viewTransitionName = ''; }));
  }
  writeQuery();
}

$('lengths').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.len !== S.len) { S.len = b.dataset.len; updateList(); } };
$('filters').onclick = e => { const b = e.target.closest('button'); if (!b) return; const k = b.dataset.f; S.only.has(k) ? S.only.delete(k) : S.only.add(k); updateList(); };
$('clear').onclick = () => { S.len = 'any'; S.only.clear(); updateList(); };
$('rows').addEventListener('click', e => {
  const a = e.target.closest('a.ride');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;   // let new-tab clicks through
  e.preventDefault();
  showRide(a.dataset.id, location.pathname + location.search + '#' + a.dataset.id);
});

/* ── Ride detail ─────────────────────────────────────────────────────── */
const dlg = $('ride');
let dlgRide = null;

// "Red Line Thorndale, 0.3 mi from the start"
function stationNote(e, where) {
  const s = (e.stations || [])[0];
  if (!s || s.mi > TRAIN_MAX) return '';
  return `<p><b>${dot(s.lines[0])}${s.lines.map(lineName).join(' / ')}</b> ${s.name}, ${s.mi.toFixed(1)} mi from the ${where}</p>`;
}
function trafficNote(v) {
  const roads = (v.busyRoads || []).filter(r => r.mi >= 0.5).slice(0, 3).map(r => `${r.name} (${r.mi} mi)`);
  if (!roads.length) return '';
  const list = roads.length > 1 ? roads.slice(0, -1).join(', ') + ' and ' + roads.at(-1) : roads[0];
  return `<p><b>Traffic</b> on ${list}</p>`;
}

// The route, drawn straight away in the map slot while the RideWithGPS embed loads
function routeSketch(line) {
  const W = 840, H = 480, P = 56, k = Math.cos(line[0][0] * Math.PI / 180);
  const xy = line.map(([lat, lng]) => [lng * k, -lat]);
  const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const s = Math.min((W - 2 * P) / (x1 - x0 || 1), (H - 2 * P) / (y1 - y0 || 1));
  const ox = (W - (x1 - x0) * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  const step = Math.max(1, Math.floor(xy.length / 600));
  const d = 'M' + xy.filter((_, i) => i % step === 0 || i === xy.length - 1)
    .map(([x, y]) => `${(ox + (x - x0) * s).toFixed(1)} ${(oy + (y - y0) * s).toFixed(1)}`).join('L');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <path d="${d}" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
    <path class="draw" pathLength="1" d="${d}" fill="none" stroke="#e4002b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function renderDetail(ride, i) {
  const v = ride.variants[i];
  $('modal-title').textContent = ride.name;
  const box = $('modal-map');
  box.innerHTML = routeSketch(v.line);
  const frame = document.createElement('iframe');
  frame.title = `${ride.name} on RideWithGPS`;
  frame.setAttribute('scrolling', 'no');
  // Fade the embed in once it has drawn, over the sketch (fallback in case load never fires)
  let shown = false;
  const reveal = () => { if (!shown) { shown = true; frame.classList.add('ready'); } };
  frame.addEventListener('load', () => setTimeout(reveal, 250));
  setTimeout(reveal, 4000);
  frame.src = `https://ridewithgps.com/embeds?type=route&id=${v.rwgps}&sampleGraph=true`;
  box.appendChild(frame);

  $('modal-body').innerHTML = `
    ${ride.variants.length > 1 ? `<div class="group variants" role="group" aria-label="Length">${ride.variants.map((x, j) =>
      `<button type="button" class="pill${j === i ? ' on' : ''}" data-i="${j}" aria-pressed="${j === i}">${fmtMi(x.mi)} mi</button>`).join('')}</div>` : ''}
    <div class="facts">
      <div>${unit(fmtMi(v.mi), 'mi')}</div>
      <div>${unit(v.gain.toLocaleString(), 'ft climb')}</div>
      <div>${unit(v.mix.path + '%', 'trail')}</div>
      <div>${unit(v.unpaved + '%', 'unpaved')}</div>
    </div>
    <div class="notes">
      ${stationNote(v.start, 'start')}${v.end ? stationNote(v.end, 'finish') : ''}${trafficNote(v)}
    </div>
    <div class="actions">
      <a class="btn primary" href="https://ridewithgps.com/routes/${v.rwgps}" target="_blank" rel="noopener">Open in RideWithGPS ↗</a>
      <a class="btn secondary" href="#map/${ride.id}">Show on map</a>
    </div>`;
  $('modal-body').querySelectorAll('.variants .pill').forEach(b => b.onclick = () => renderDetail(ride, +b.dataset.i));
  $('modal-scroll').scrollTop = 0;
}

// Opening a ride adds a history entry, so the phone's back gesture closes it
function showRide(id, url = location.href) {
  history.pushState({ ride: id, pushed: true }, '', url);
  sync();
}
function openDetail(ride) {
  if (dlgRide !== ride) renderDetail(ride, 0);
  dlgRide = ride;
  if (!dlg.open) dlg.showModal();
  document.title = `${ride.name} — Best Rides Chi`;
}
function closeDetail() {
  if (!dlg.open) return;
  dlg.close();
  dlgRide = null;
  setTimeout(() => { if (!dlg.open) $('modal-map').innerHTML = ''; }, 220);   // stop the embed after the fade
  document.title = TITLES[view];
}
function dismissDetail() {
  if (history.state && history.state.pushed) return history.back();       // popstate → sync closes it
  const keep = location.hash.startsWith('#map') || location.hash === '#data' ? location.hash : '';
  history.replaceState(null, '', location.pathname + location.search + keep);
  sync();
}
$('modal-close').onclick = dismissDetail;
dlg.addEventListener('cancel', e => { e.preventDefault(); dismissDetail(); });         // Esc
dlg.addEventListener('click', e => { if (e.target === dlg) dismissDetail(); });       // backdrop
dlg.addEventListener('click', e => {                                                  // "Show on map" inside the detail
  const a = e.target.closest('a[href^="#map"]'); if (!a) return;
  e.preventDefault();
  history.replaceState(null, '', location.pathname + location.search + a.getAttribute('href'));
  sync();
});

/* ── Views + routing ─────────────────────────────────────────────────── */
const TITLES = { rides: 'Best Rides Chi', map: 'Map — Best Rides Chi', data: 'Data — Best Rides Chi' };
let view = null;

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'map' || h.startsWith('map/')) return { view: 'map', mapRide: BY_ID[h.slice(4)] || null };
  if (h === 'data') return { view: 'data' };
  return { view: 'rides', ride: BY_ID[h] || null };
}

// One view-transition helper: animates where the browser supports it, instant elsewhere
function transition(fn) {
  if (STILL || !document.startViewTransition) return fn(), null;
  const t = document.startViewTransition(fn);
  t.ready.catch(() => {});   // interrupted by the next navigation: fine
  return t;
}

// Resolves once the new view is actually in the page (a view transition swaps it a frame later)
function setView(next, animate) {
  if (next === view) return Promise.resolve();
  const apply = () => {
    view = next;
    document.body.dataset.view = next;
    $('view-rides').hidden = next !== 'rides';
    $('view-data').hidden = next !== 'data';
    $('view-map').hidden = next !== 'map';
    document.querySelectorAll('#nav a').forEach(a => a.dataset.v === next ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    if (next === 'data' && !$('view-data').innerHTML) renderData();
    if (next !== 'map') window.scrollTo({ top: next === 'rides' ? listScroll : 0 });
    if (!dlg.open) document.title = TITLES[next];
  };
  if (view === 'rides') listScroll = window.scrollY;
  const t = animate && view ? transition(apply) : apply();
  return t ? t.updateCallbackDone : Promise.resolve();
}
let listScroll = 0;

function sync(animate = true) {
  const r = route();
  // A ride's own link (#<ride>) opens its detail over the list
  if (r.ride && !(history.state && history.state.ride === r.ride.id)) history.replaceState({ ride: r.ride.id }, '');
  const shown = setView(r.view, animate);
  if (r.view === 'map') shown.then(() => showMap(r.mapRide));
  const want = history.state && BY_ID[history.state.ride];
  want ? openDetail(want) : closeDetail();
}
history.scrollRestoration = 'manual';   // views manage their own scroll
addEventListener('popstate', () => sync());
addEventListener('hashchange', () => sync());

/* ── Map (Leaflet loads the first time it's needed, or once the page is idle) ── */
let leafletReady = null;
function loadLeaflet() {
  return leafletReady = leafletReady || new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload = resolve; js.onerror = reject;
    document.head.appendChild(js);
  });
}
document.querySelector('#nav a[data-v="map"]').addEventListener('pointerenter', loadLeaflet, { once: true });

let M = null;   // the map's own state, created on first visit
async function showMap(ride) {
  await loadLeaflet();
  if (!M) M = initMap();
  M.map.invalidateSize();
  if (ride && (!M.active || M.active.id !== ride.id)) M.expand(ride);
  else if (!ride && M.active) history.replaceState(history.state, '', location.pathname + location.search + '#map/' + M.active.id);   // keep the selection
}

function initMap() {
  const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const map = L.map('map', { zoomControl: true });
  L.tileLayer(TILE_URL, {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · transit: CTA, Metra, NICTD GTFS',
    maxZoom: 19,
  }).addTo(map);
  map.createPane('transit').style.zIndex = 420;
  map.createPane('rideLines').style.zIndex = 610;
  map.createPane('rideDots').style.zIndex = 620;

  const RIDE_COLOR = '#14181f';   // dots
  const ROUTE_COLOR = '#e4002b';  // opened route
  const DOT = { pane: 'rideDots', radius: 7, color: '#fff', weight: 2, fillColor: RIDE_COLOR, fillOpacity: 1, opacity: 1 };
  const markers = {};
  const card = $('ride-card'), cardBody = $('card-body');
  const M = { map, active: null };
  let activeLayers = [], variantLayers = [];

  RIDES.forEach(ride => {
    const v = ride.variants[0];
    const m = L.circleMarker([v.start.lat, v.start.lng], DOT)
      .bindTooltip(`${ride.name} · ${fmtMi(v.mi)} mi`, { direction: 'top', opacity: 0.9 });
    m.on('click', e => { L.DomEvent.stopPropagation(e); M.active && M.active.id === ride.id ? M.collapse() : M.expand(ride); });
    m.addTo(map);
    markers[ride.id] = m;
  });
  map.fitBounds(L.latLngBounds(RIDES.map(r => [r.variants[0].start.lat, r.variants[0].start.lng])), { padding: [40, 40] });

  const setHash = id => history.replaceState(history.state, '', location.pathname + location.search + '#map' + (id ? '/' + id : ''));

  M.collapse = (updateHash = true) => {
    activeLayers.concat(variantLayers).forEach(l => map.removeLayer(l));
    activeLayers = []; variantLayers = [];
    if (M.active) markers[M.active.id].setStyle(DOT);
    M.active = null;
    map.getContainer().classList.remove('picked');
    card.classList.remove('open');
    if (updateHash) setHash(null);
  };

  // Start fetching the tiles the map will land on as the flight begins, so it
  // arrives sharp instead of showing stretched, blurry tiles while they load.
  function prefetchTiles(center, zoom) {
    const half = map.getSize().divideBy(2), c = map.project(center, zoom);
    const lo = c.subtract(half).divideBy(256).floor(), hi = c.add(half).divideBy(256).floor();
    const n = 2 ** zoom;
    for (let x = lo.x; x <= hi.x; x++) for (let y = Math.max(0, lo.y); y <= Math.min(n - 1, hi.y); y++) {
      new Image().src = L.Util.template(TILE_URL, { z: zoom, x: ((x % n) + n) % n, y });
    }
  }

  M.expand = ride => {
    M.collapse(false);
    M.active = ride;
    map.getContainer().classList.add('picked');
    markers[ride.id].setStyle({ radius: 9, fillColor: '#fff', color: ROUTE_COLOR, weight: 3, fillOpacity: 1, opacity: 1 });
    const v = ride.variants[0];
    activeLayers.push(L.polyline(v.line, { pane: 'rideLines', color: '#fff', weight: 9, opacity: 0.9 }).addTo(map));
    activeLayers.push(L.polyline(v.line, { pane: 'rideLines', color: ROUTE_COLOR, weight: 4.5 }).addTo(map));
    // Other lengths: dashed, toggled from the card
    variantLayers = ride.variants.slice(1).map(x => L.layerGroup([
      L.polyline(x.line, { pane: 'rideLines', color: '#fff', weight: 7, opacity: 0.85 }),
      L.polyline(x.line, { pane: 'rideLines', color: RIDE_COLOR, weight: 3, dashArray: '6 6' })
        .bindTooltip(fmtMi(x.mi) + ' mi', { sticky: true }),
    ]).addTo(map));
    if (v.end) {
      activeLayers.push(L.circleMarker([v.end.lat, v.end.lng], { pane: 'rideDots', radius: 6, color: ROUTE_COLOR, weight: 3, fillColor: '#fff', fillOpacity: 1 })
        .bindTooltip('Finish · ' + v.end.label, { direction: 'top' }).addTo(map));
    }

    cardBody.innerHTML = `
      <div class="card-name">${ride.name}</div>
      ${ride.variants.length > 1 ? '' : `<div class="card-mi">${unit(fmtMi(v.mi), 'mi')}</div>`}
      ${ride.variants.length > 1 ? `<div class="card-vars">
        <span class="pill on primary"><span class="var-dash"></span>${fmtMi(v.mi)} mi</span>
        ${ride.variants.slice(1).map((x, i) => `<button type="button" class="pill" data-i="${i}" aria-pressed="true"><span class="var-dash"></span>${fmtMi(x.mi)} mi</button>`).join('')}
      </div>` : ''}
      <div class="card-links">
        <a class="btn primary" href="https://ridewithgps.com/routes/${v.rwgps}" target="_blank" rel="noopener">RideWithGPS ↗</a>
        <button type="button" class="btn secondary" id="card-details">Details</button>
      </div>`;
    card.classList.add('open');
    card.scrollTop = 0;
    cardBody.querySelectorAll('.card-vars button').forEach(b => b.onclick = () => {
      const g = variantLayers[+b.dataset.i];
      map.hasLayer(g) ? map.removeLayer(g) : map.addLayer(g);
      b.setAttribute('aria-pressed', map.hasLayer(g));
      b.style.opacity = map.hasLayer(g) ? '' : '.45';
    });
    $('card-details').onclick = () => showRide(ride.id);   // detail opens over the map

    const b = L.latLngBounds(v.line);
    ride.variants.slice(1).forEach(x => b.extend(L.latLngBounds(x.line)));
    const sz = map.getSize();
    if (b.isValid() && sz.x > 0 && sz.y > 0) {
      // Keep the route clear of the card: beside it on wide screens, above it on phones
      const narrow = sz.x <= 640;
      const opts = { paddingTopLeft: [40, 50], paddingBottomRight: narrow ? [30, card.offsetHeight + 30] : [card.offsetWidth + 40, 40],
                     duration: 0.7, maxZoom: 13 };
      const dest = map._getBoundsCenterZoom(b, opts);
      prefetchTiles(dest.center, dest.zoom);
      // Leaflet stretches vector layers while it zooms, so mid-flight the route and
      // dots blow up into blurry blobs. Hide them for the flight; fade them in once
      // the map lands and they're redrawn sharp.
      const el = map.getContainer();
      if (!STILL) {
        el.classList.add('flying');
        map.once('moveend', () => requestAnimationFrame(() => el.classList.remove('flying')));
        map.flyToBounds(b, opts);
      } else map.fitBounds(b, opts);
    }
    setHash(ride.id);
  };

  $('card-close').onclick = () => M.collapse();
  map.on('click', () => M.collapse());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && view === 'map' && !dlg.open && M.active) M.collapse(); });

  /* Transit: every CTA, Metra and South Shore line. A white casing under all of them keeps
     parallel lines apart downtown; CTA draws on top. Hover or tap a line for its name. */
  let transitOn = false, transitLayer = null;
  function buildTransit() {
    const g = L.layerGroup();
    const order = { metra: 0, southshore: 1, cta: 2 };
    const lines = [...TRANSIT_LINES].sort((a, b) => order[a.sys] - order[b.sys]);
    const weight = l => l.sys === 'cta' ? 3.5 : 2.5;
    lines.forEach(l => L.polyline(l.coords, { pane: 'transit', color: '#fff', weight: weight(l) + 3, opacity: 1, interactive: false }).addTo(g));
    lines.forEach(l => {
      const name = l.sys === 'metra' && !l.name.startsWith('Metra') ? `Metra ${l.name}` : l.name;
      L.polyline(l.coords, { pane: 'transit', color: lineColor(l), weight: weight(l), opacity: 1 })
        .bindTooltip(name, { sticky: true }).addTo(g);
    });
    return g;
  }
  function renderLegend() {
    const cta = TRANSIT_LINES.filter(l => l.sys === 'cta').map(l => l.color);
    const stripes = `linear-gradient(90deg, ${cta.map((c, i) => `${c} ${i / cta.length * 100}% ${(i + 1) / cta.length * 100}%`).join(', ')})`;
    $('legend').innerHTML = [['CTA', stripes], ['Metra', SYS_COLOR.metra], ['South Shore', SYS_COLOR.southshore]]
      .map(([label, c]) => `<span class="legend-row"><span class="legend-line" style="--c:${c}"></span>${label}</span>`).join('');
  }
  const press = (btn, on) => { btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on); };
  $('btn-rides').onclick = function () {
    const on = !this.classList.contains('on'); press(this, on);
    if (!on) M.collapse();
    Object.values(markers).forEach(m => on ? m.addTo(map) : map.removeLayer(m));
  };
  $('btn-transit').onclick = function () {
    transitOn = !this.classList.contains('on'); press(this, transitOn);
    if (transitOn) { transitLayer = transitLayer || buildTransit(); transitLayer.addTo(map); }
    else if (transitLayer) map.removeLayer(transitLayer);
    if (transitOn && !$('legend').innerHTML) renderLegend();
    $('legend').hidden = !transitOn;
  };
  return M;
}

/* ── Data page: what each number means and where it comes from ───────── */
function renderData() {
  $('view-data').innerHTML = `
    <h2>What's shown</h2>
    <table>
      <tr><th>Miles</th><td>RideWithGPS route.</td></tr>
      <tr><th>Trail filter</th><td>At least 70% on bike paths and trails, and under 5% on main (tertiary-or-larger) roads. RideWithGPS road type, checked against OpenStreetMap.</td></tr>
      <tr><th>Train to start</th><td>A station that allows bikes within 1 mi of the start, straight-line. The detail shows the closest one within ${TRAIN_MAX} mi of the start and finish. CTA, Metra and South Shore GTFS.</td></tr>
      <tr><th>Climb</th><td>RideWithGPS total, minus jumps in its elevation data (≥ 4 m within 20 m of travel).</td></tr>
      <tr><th>% trail</th><td>Share of distance on bike paths and trails, including separated paths beside a road.</td></tr>
      <tr><th>Traffic on</th><td>Main roads with the most distance on the route.</td></tr>
    </table>
    <h2>Bikes on trains</h2>
    <table>
      ${Object.entries(BIKE_RULES).map(([k, r]) => `<tr><th>${SYS[k]}</th><td>${r.short} · <a href="${r.src}" target="_blank" rel="noopener">source</a></td></tr>`).join('')}
      <tr><th>South Shore bike stations</th><td>Hegewisch, Hammond Gateway, South Hammond, Munster Ridge, Munster/Dyer, East Chicago, Miller, Portage/Ogden Dunes, Dune Park, 11th St (Michigan City), South Bend, and the Chicago stations shared with Metra.</td></tr>
    </table>
    <h2>Sources</h2>
    <table>
      <tr><th>Routes</th><td><a href="https://ridewithgps.com/partners/great-rides-chicago" target="_blank" rel="noopener">Great Rides Chicago</a>, Great Rides Schererville and other public routes on RideWithGPS</td></tr>
      <tr><th>Roads, places, maps</th><td><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</td></tr>
    </table>
    <p class="stamp">Built ${BUILD_DATE}</p>`;
}

updateList(false);
sync(false);
// Make the map tab instant: fetch Leaflet once the list is up and the page is idle
(window.requestIdleCallback || (fn => setTimeout(fn, 1500)))(() => loadLeaflet(), { timeout: 4000 });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack Kane</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=3">
  <style id="os-injected-style"></style>
</head>
<body>

  <div class="fridge-viewport" id="fridge-viewport">
    <div class="fridge" id="fridge">
      <img class="fridge-bg" src="fridge2.jpg" alt="Retro black refrigerator" draggable="false">
      <!-- overengineeRING webring -->
      <div id="ring-wrap">
        <iframe id="ring-embed"
                src="https://overengineering.kognise.dev/embed/jack?link_color=%23000000"
                title="overengineeRING embed"
                loading="lazy"></iframe>
      </div>
    </div>
  </div>

  <!-- Fridge OS Window -->
  <div id="os-overlay">
    <div id="os-window">
      <div id="os-titlebar">
        <div class="traffic-lights">
          <button class="tl-btn tl-close" id="tl-close" data-glyph="✕"></button>
          <button class="tl-btn tl-min"   id="tl-min"   data-glyph="−"></button>
          <button class="tl-btn tl-max"   id="tl-max"   data-glyph="+"></button>
        </div>
        <span id="os-window-title"></span>
      </div>
      <div id="os-content"><div id="os-content-inner"></div></div>
      <div class="resize-handle resize-e"  data-dir="e"></div>
      <div class="resize-handle resize-w"  data-dir="w"></div>
      <div class="resize-handle resize-s"  data-dir="s"></div>
      <div class="resize-handle resize-se" data-dir="se"></div>
      <div class="resize-handle resize-sw" data-dir="sw"></div>
    </div>
  </div>

  <!-- Firebase realtime DB (tic-tac-toe only) — deferred so it never blocks
       the fridge's first paint. Preconnect warms the TLS handshake early. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fridge-b5a68-default-rtdb.firebaseio.com" crossorigin>
  <!-- Warm the connection for the Amtrak map's live train data -->
  <link rel="preconnect" href="https://api.amtraker.com" crossorigin>
  <!-- Warm the RideWithGPS connection so the Rides maps load quickly on open -->
  <link rel="preconnect" href="https://ridewithgps.com">
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="app.js?v=10"></script>
</body>
</html>

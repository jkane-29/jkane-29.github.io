<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack Kane</title>
  <meta name="description" content="Jack Kane's corner of the internet — a retro fridge of things I've made or particularly like.">

  <!-- Social share cards (Open Graph + Twitter/X) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jack Kane">
  <meta property="og:url" content="https://www.jackkane.me/">
  <meta property="og:title" content="Jack Kane">
  <meta property="og:description" content="A retro fridge of things I've made or particularly like.">
  <meta property="og:image" content="https://www.jackkane.me/og-image.jpg?v=31e904d6">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A retro black refrigerator.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jack Kane">
  <meta name="twitter:description" content="A retro fridge of things I've made or particularly like.">
  <meta name="twitter:image" content="https://www.jackkane.me/og-image.jpg?v=31e904d6">

  <link rel="canonical" href="https://www.jackkane.me/">
  <link rel="icon" href="/favicon.ico?v=33a546f3" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=c024c493">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=08c28d1a">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=36553f6f">
  <link rel="stylesheet" href="styles.css?v=d7af1d98">
  <!-- Handwriting face for the page-views sticky note -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
  <style id="os-injected-style"></style>
</head>
<body>

  <div class="fridge-viewport" id="fridge-viewport">
    <div class="fridge" id="fridge">
      <img class="fridge-bg" src="fridge2.jpg" alt="Retro black refrigerator" draggable="false">
      <!-- overengineeRING webring -->
      <div id="ring-wrap">
        <iframe id="ring-embed"
                src="https://overengineering.kognise.dev/embed/jack?link_color=%23000000"
                title="overengineeRING embed"
                loading="lazy"></iframe>
      </div>
      <!-- Page-views sticky note (revealed by js/live.js once Firebase answers) -->
      <div id="views-magnet" hidden>
        <span id="views-count">—</span>
        <span id="views-label">page views</span>
      </div>
    </div>
  </div>

  <!-- Fridge OS Window -->
  <div id="os-overlay">
    <div id="os-window">
      <div id="os-titlebar">
        <div class="traffic-lights">
          <button class="tl-btn tl-close" id="tl-close" aria-label="Close"></button>
          <button class="tl-btn tl-min"   id="tl-min" aria-label="Minimise"></button>
          <button class="tl-btn tl-max"   id="tl-max" aria-label="Full screen"></button>
        </div>
        <span id="os-window-title"></span>
      </div>
      <div id="os-content"><div id="os-content-inner"></div></div>
      <div class="resize-handle resize-e"  data-dir="e"></div>
      <div class="resize-handle resize-w"  data-dir="w"></div>
      <div class="resize-handle resize-s"  data-dir="s"></div>
      <div class="resize-handle resize-se" data-dir="se"></div>
      <div class="resize-handle resize-sw" data-dir="sw"></div>
    </div>
  </div>

  <!-- Firebase realtime DB (tic-tac-toe only) — deferred so it never blocks
       the fridge's first paint. Preconnect warms the TLS handshake early. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fridge-b5a68-default-rtdb.firebaseio.com" crossorigin>
  <!-- Warm the connection for the Amtrak map's live train data -->
  <link rel="preconnect" href="https://api.amtraker.com" crossorigin>
  <!-- Warm the RideWithGPS connection so the Rides maps load quickly on open -->
  <link rel="preconnect" href="https://ridewithgps.com">
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="js/core.js?v=b5be4786"></script>
  <script src="js/layout.js?v=e8647544"></script>
  <script src="js/window.js?v=18e6f8b2"></script>
  <script src="js/fridge.js?v=d9c946a9"></script>
  <script src="js/door.js?v=8c5b6e0f"></script>
  <script src="js/orb.js?v=91e1e8ef"></script>
  <script src="js/away.js?v=091a498c"></script>
  <script src="js/live.js?v=1e499bb8"></script>
</body>
</html>

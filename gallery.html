<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - John Kane</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.4;
            color: #374151;
            background-color: #fefefe;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 60px;
            padding: 60px 20px;
        }

        .sidebar {
            position: sticky;
            top: 60px;
            height: fit-content;
        }

        .name {
            font-family: 'Source Serif Pro', serif;
            font-size: 2.2rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #111827;
            line-height: 1.1;
            text-decoration: none;
            display: block;
        }

        .name:hover {
            color: #059669;
        }

        .title {
            color: #059669;
            font-weight: 500;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.2;
        }

        .nav-links {
            list-style: none;
            margin-bottom: 30px;
        }

        .nav-links li {
            margin-bottom: 8px;
        }

        .nav-links a {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            line-height: 1.3;
        }

        .nav-links a:hover {
            color: #059669;
        }

        .nav-links a.current {
            color: #059669;
            font-weight: 500;
        }

        .contact-info {
            font-size: 0.9rem;
            color: #6b7280;
            line-height: 1.4;
        }

        .contact-info a {
            color: #059669;
            text-decoration: none;
        }

        .main-content {
            padding-top: 20px;
        }

        .gallery-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0;
            background: none;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            border: none;
        }

        .gallery-frame {
            position: relative;
            width: 100%;
            height: 80vh;
            background: none;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 0;
        }

        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .gallery-image.active {
            opacity: 1;
        }

        .gallery-controls {
            display: none;
        }

        .gallery-progress {
            display: none;
        }

        .gallery-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 16px;
            border-radius: 6px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .gallery-container:hover .gallery-info {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-info-text {
            font-family: "Source Serif Pro", serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: white;
            line-height: 1.2;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 30px 20px;
            }
            
            .sidebar {
                position: static;
                border-bottom: 1px solid #e5e7eb;
                padding-bottom: 20px;
            }
            
            .name {
                font-size: 1.8rem;
            }

            .gallery-frame {
                height: 70vh;
            }

            .gallery-info {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="index.html" class="name">John Kane</a>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="ideas.html">Ideas</a></li>
                    <li><a href="reading.html">Reading</a></li>
                    <li><a href="writing.html">Writing</a></li>
                    <li><a href="woodshop.html">Woodshop</a></li>
                    <li><a href="gallery.html" class="current">Gallery</a></li>
                </ul>
            </nav>
            
            <div class="contact-info">
                <p><a href="mailto:jkane29@icloud.com">jkane29@icloud.com</a></p>
                <p><a href="https://twitter.com/desperad0V" target="_blank">@desperad0V</a></p>
                <p>Office: N/A</p>
            </div>
        </aside>

        <main class="main-content">
            <div class="gallery-container">
                <div class="gallery-progress"></div>
                <div class="gallery-frame">
                </div>
                <div class="gallery-controls" id="gallery-controls" style="display: none;"></div>
            </div>
        </main>
    </div>

    <script>
        class Gallery {
            constructor() {
                this.images = [];
                this.currentIndex = 0;
                this.intervalId = null;
                this.progressId = null;
                this.cycleTime = 30000; // 30 seconds
                
                this.frame = document.querySelector('.gallery-frame');
                this.infoText = document.getElementById('info-text');
                this.controlsContainer = document.getElementById('gallery-controls');
                this.progressBar = document.querySelector('.gallery-progress');
                
                this.init();
            }

            async init() {
                await this.loadImages();
                if (this.images.length > 0) {
                    this.setupGallery();
                    this.startSlideshow();
                }
            }

            async loadImages() {
                // Art images from essays/Gallery/ directory with proper URL encoding
                const imageData = [
                    {
                        src: 'essays/Gallery/Adelita,%20Alfredo%20Arreguin.jpeg',
                        title: 'Adelita',
                        artist: 'Alfredo Arreguin'
                    },
                    {
                        src: 'essays/Gallery/Black%20Cross%20New%20Mexico,%20Georgia%20O%27Keeffe.jpg',
                        title: 'Black Cross New Mexico',
                        artist: 'Georgia O\'Keeffe'
                    },
                    {
                        src: 'essays/Gallery/Cosmic%20Cities,%20Arthur%20Wesley%20Dow.jpg',
                        title: 'Cosmic Cities',
                        artist: 'Arthur Wesley Dow'
                    },
                    {
                        src: 'essays/Gallery/Landscape%20No.%203%20Marsden%20Hartley.jpg',
                        title: 'Landscape No. 3',
                        artist: 'Marsden Hartley'
                    },
                    {
                        src: 'essays/Gallery/Landscape%20with%20Threee%20Trees,%20Richard%20Diebenkorn.jpeg',
                        title: 'Landscape with Three Trees',
                        artist: 'Richard Diebenkorn'
                    },
                    {
                        src: 'essays/Gallery/Salish%20Sea,%20Alfredo%20Arreguin.jpg',
                        title: 'Salish Sea',
                        artist: 'Alfredo Arreguin'
                    },
                    {
                        src: 'essays/Gallery/Signs,%20Lee%20Friedlander.jpg',
                        title: 'Signs',
                        artist: 'Lee Friedlander'
                    },
                    {
                        src: 'essays/Gallery/Summer%20in%20the%20Catskills,%20George%20Inness.jpg',
                        title: 'Summer in the Catskills',
                        artist: 'George Inness'
                    },
                    {
                        src: 'essays/Gallery/The%20Executive%20Apartment,%20Lynne%20Cohen.jpg',
                        title: 'The Executive Apartment',
                        artist: 'Lynne Cohen'
                    },
                    {
                        src: 'essays/Gallery/The%20Monk,%20George%20Inness.jpg',
                        title: 'The Monk',
                        artist: 'George Inness'
                    }
                ];

                // Load images that exist
                for (const data of imageData) {
                    try {
                        await this.checkImageExists(data.src);
                        this.images.push(data);
                        console.log(`Loaded: ${data.title}`);
                    } catch (error) {
                        console.log(`Failed to load: ${data.src}`);
                    }
                }
            }

            checkImageExists(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(src);
                    img.onerror = () => reject(src);
                    img.src = src;
                });
            }

            setupGallery() {
                // Create image elements
                this.images.forEach((imageData, index) => {
                    const img = document.createElement('img');
                    img.src = imageData.src;
                    img.alt = imageData.title;
                    img.className = 'gallery-image';
                    if (index === 0) img.classList.add('active');
                    this.frame.appendChild(img);
                });

                // Create info box
                const infoBox = document.createElement('div');
                infoBox.className = 'gallery-info';
                infoBox.id = 'gallery-info';
                infoBox.innerHTML = `
                    <div class="gallery-info-text" id="info-text">${this.images[0]?.title || 'Gallery'} • ${this.images[0]?.artist || 'Artist'}</div>
                `;
                this.frame.appendChild(infoBox);

                // Update references
                this.infoText = document.getElementById('info-text');

                this.updateInfoBox();
            }

            goToSlide(index) {
                // Update active image
                document.querySelectorAll('.gallery-image').forEach((img, i) => {
                    img.classList.toggle('active', i === index);
                });
                
                this.currentIndex = index;
                this.updateInfoBox();
                this.resetProgress();
            }

            nextSlide() {
                const nextIndex = (this.currentIndex + 1) % this.images.length;
                this.goToSlide(nextIndex);
            }

            startSlideshow() {
                if (this.images.length <= 1) return;
                
                this.intervalId = setInterval(() => {
                    this.nextSlide();
                }, this.cycleTime);

                this.startProgress();
            }

            startProgress() {
                let progress = 0;
                const increment = 100 / (this.cycleTime / 100);
                
                this.progressId = setInterval(() => {
                    progress += increment;
                    this.progressBar.style.width = `${Math.min(progress, 100)}%`;
                    
                    if (progress >= 100) {
                        progress = 0;
                    }
                }, 100);
            }

            resetProgress() {
                if (this.progressId) {
                    clearInterval(this.progressId);
                }
                this.progressBar.style.width = '0%';
                this.startProgress();
            }

            pauseSlideshow() {
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
                if (this.progressId) {
                    clearInterval(this.progressId);
                    this.progressId = null;
                }
            }

            updateInfoBox() {
                if (this.images.length > 0 && this.currentIndex < this.images.length) {
                    const currentImage = this.images[this.currentIndex];
                    this.infoText.textContent = `${currentImage.title || "Untitled"} • ${currentImage.artist || "Unknown Artist"}`;
                }
            }

            resumeSlideshow() {
                this.startSlideshow();
            }
        }

        // Initialize gallery when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const gallery = new Gallery();

            // Pause on hover, resume on mouse leave
            const galleryContainer = document.querySelector('.gallery-container');
            galleryContainer.addEventListener('mouseenter', () => {
                gallery.pauseSlideshow();
            });
            
            galleryContainer.addEventListener('mouseleave', () => {
                gallery.resumeSlideshow();
            });
        });
    </script>
</body>
</html>

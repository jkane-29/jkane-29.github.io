<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing - Jack Kane</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }
    body {
      height: 100%; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #ffffff; color: #1c1c1e;
    }

    /* Two-pane Notes layout (desktop) */
    .nx-app { display: flex; height: 100%; position: relative; }

    .nx-sidebar {
      width: 260px; flex-shrink: 0;
      background: #faf9f7;
      border-right: 0.5px solid #d9d3c8;
      display: flex; flex-direction: column;
      transition: width 0.2s ease;
    }
    .nx-sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }
    .nx-sidebar-header {
      padding: 12px 10px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 0.5px solid #d9d3c8;
    }
    .nx-sidebar-title { font-size: 13px; font-weight: 600; color: #1c1c1e; }
    .nx-hide-btn, .nx-show-btn {
      background: none; border: none; cursor: pointer; padding: 0;
      color: #8a8478; display: flex; align-items: center;
      justify-content: center; width: 26px; height: 26px;
      border-radius: 5px; transition: color 0.15s, background 0.15s;
    }
    .nx-hide-btn:hover, .nx-show-btn:hover { color: #1c1c1e; background: #ebe7de; }
    /* Anchored to the notes app, not the viewport — inside the fridge OS window
       a fixed button would land on top of the titlebar's traffic lights. */
    .nx-show-btn { position: absolute; left: 10px; top: 11px; z-index: 5; }
    .nx-hide-btn[hidden], .nx-show-btn[hidden] { display: none; }
    .nx-list { flex: 1; overflow: auto; padding: 2px 8px 14px; }
    .nx-group { font-size: 12px; font-weight: 600; color: #8a8478; padding: 10px 6px 4px; }
    .nx-row { padding: 9px 10px; border-radius: 8px; cursor: pointer; }
    .nx-row:hover { background: #f0ede6; }
    .nx-row.active, .nx-row.active:hover { background: #f7e39c; }
    .nx-row-title {
      font-size: 14px; font-weight: 600; color: #1c1c1e;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nx-row-sub {
      font-size: 12px; color: #a0998c; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nx-row.active .nx-row-sub { color: #7a7468; }

    .nx-pane { flex: 1; overflow: auto; padding: 18px 40px 44px; }
    .nx-back {
      display: none;
      background: none; border: none; cursor: pointer;
      font-size: 15px; color: #d1a000; padding: 0; margin-bottom: 12px;
      align-items: center; gap: 2px;
    }
    .nx-date { text-align: center; font-size: 11px; color: #b0a99c; margin-bottom: 18px; }
    .nx-title { font-size: 22px; font-weight: 700; color: #1c1c1e; line-height: 1.3; margin-bottom: 12px; }
    .nx-body { font-size: 15px; line-height: 1.55; color: #1c1c1e; }
    .nx-body p { margin: 0 0 16px; }
    .nx-body p:last-child { margin-bottom: 0; }
    .nx-body a { color: #1c1c1e; }

    /* Mobile: single column, drill down into a note with a back button */
    @media (max-width: 600px), (pointer: coarse) {
      /* Warm off-white across the whole page (matches the list background) */
      body { background: #faf9f7; }
      .nx-app { display: block; height: auto; }
      .nx-sidebar { width: auto; border-right: none; background: #faf9f7; }
      /* Mobile drills down instead of collapsing a sidebar */
      .nx-sidebar-header, .nx-hide-btn, .nx-show-btn { display: none; }
      .nx-list { overflow: visible; }
      .nx-row { border-bottom: 0.5px solid #e7e2d8; border-radius: 0; padding: 12px 10px; }
      .nx-row.active, .nx-row.active:hover, .nx-row:hover { background: none; }
      .nx-pane { display: none; padding: 14px 20px 40px; }
      .nx-back { display: flex; }
      .nx-app.reading .nx-sidebar { display: none; }
      .nx-app.reading .nx-pane { display: block; }
    }
  </style>
</head>
<body>
  <div class="nx-app" id="nx-app">
    <div class="nx-sidebar" id="nx-sidebar">
      <div class="nx-sidebar-header">
        <div class="nx-sidebar-title">Writing</div>
        <button class="nx-hide-btn" id="nx-hide-btn" title="Hide sidebar" aria-label="Hide sidebar">
          <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.4" y="3" width="13.2" height="10" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.25"/>
            <path d="M6.1 3.2v9.6" stroke="currentColor" stroke-width="1.25"/>
          </svg>
        </button>
      </div>
      <div class="nx-list" id="nx-list"></div>
    </div>
    <button class="nx-show-btn" id="nx-show-btn" title="Show sidebar" aria-label="Show sidebar" hidden>
      <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1.4" y="3" width="13.2" height="10" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.25"/>
        <path d="M6.1 3.2v9.6" stroke="currentColor" stroke-width="1.25"/>
      </svg>
    </button>
    <div class="nx-pane" id="nx-pane">
      <button class="nx-back" id="nx-back">‹ Writing</button>
      <div id="nx-content"></div>
    </div>
  </div>

  <script>
  (function () {
    // date: ISO datetime. Set `hidden: true` on a note to keep it unpublished.
    const ALL_NOTES = [
      {
        title: "Etudes",
        date: "2026-03-29T10:00:00",
        hidden: true,   // set to false (or remove) to publish
        body: `<p>Etudes are an evolving study in experience. Definitionally, a rote mode of practice for classical pianists. They ask the aspiring pianist how far their capabilities will go mechanically, in assigning melodies to be produced to shape rather than sound.</p>
<p>This industrial and self-serious music is rather bleak from this perspective. The respite is no lack of spartan practice, but to write these lessons for yourself, directly aimed at your limitations. To build your body of work on the back of weaknesses for particular scales, repetitions, and pacing. This doesn't only force improvement, but a degree of personal style, who else could share your distinctive mistakes?</p>
<p>This as Josef Lhevinne (a 19th century pianist) said was the ultimate goal of practice, not to become a machine, but to free yourself from mechanics. This freedom inevitably takes time, though with experience some enduringly difficult piece can come shockingly easy. You may need revisions or new routines but you will still have a work that triumphs your personal experience and style.</p>
<p>As these pieces define a career, they start to equally delineate the timeline of your life. You can imagine the 80 year old composer, hammering through the etude his teacher taught him at 16. Some subtle difference in speed and intonation, he'll hear indicatively of that first teacher, their family house in Baltimore, taking the train to the end of the line and playing in a windowless room.</p>`
      },
      {
        title: "Working as a Sound Designer",
        date: "2026-01-12T15:20:00",
        body: `<p>The most objectively creative job I had was as a sound design intern for an animation studio. This was in the second semester of junior year, when most of my college friends were in the depths of recruiting for internships and jobs after college. Instead, I was an unpaid intern for a 3 person animation studio, making jingles on Ableton for a Children's television show, a realtors association, and an Avengers inspired short film (the details escape me).</p>
<p>Those were my halcyon days. I'd spring out of some economics class to meet with the creative director who'd reference some increasingly <a href="https://en.wikipedia.org/wiki/Ecco_the_Dolphin" target="_blank" style="color:#1c1c1e;">obscure</a> video game soundtrack as we talked through my latest rough cut. Later, I'd take his feedback on the low end of a bass line or the phrasing of a melody and hammer it out in the university's math atrium.</p>
<p>The hardest part of the internship was explaining it to others. For the more career oriented in my circle, there was no path between an economics degree and a brassy synth roll. To grasp for control, I'd revert to a spiel on my future life as an IP lawyer. It was as convenient a truth as any.</p>
<p>Although the work may have been conventionally unwise it taught me the core elements of project management. Every piece of work I produced, the tracks, filters, effects, and samples had to be in support of the final output. That was the only real constraint, I was learning how to add and subtract elements with a goal in mind.</p>
<p>I remember the piece I put together for the realtors association. The core theme was distinctive sounds of home ownership, think jangling keys and a creaking door backed by an escalating piano roll. In scanning through hundreds of samples of keys and doors I thought with each, does this connect to my idea, is it sufficiently good to force me to revise the existing tracks? This process was like sifting, taking the massive compiled world of noise and filtering for the piece that wouldn't sound dissonant.</p>
<p>I definitely wasn't exceptional at jingle making and knew then that my lack of formal musical education was leading to generic output. In a way, that additive process showed me that there was no amount of refining that could bridge my lack of skills. I largely stopped making music after the internship ended.</p>`
      },
      {
        title: "Working as a Cook",
        date: "2026-03-04T11:00:00",
        body: `<p>Cooking and working in kitchens taught me many surprising things, not necessarily in the Bourdain style of "my god the bread is dirty!", but rather that cooking can require very different skillsets. Baking is a game of calculations, where a small variance leads to huge differences. A good baker is as much of a nightcrawler as they are an alchemist of yeast. For all the attention to detail there's a separate artistry required. Shaping dough/bread is the opposite of technical, more like learning the footwork to a choreographed dance that takes many repetitions to feel natural.</p>
<p>I also learned how fun it is to work in a flow state and optimize with constraints. Given 30 tasks as a prep cook, how can I optimize across my 6 burners, 5 oven racks, and industrial mixing bowl. It was an incredibly fun game of chess with people shouting, 500 degree ovens, tight spaces, and hard deadlines. Getting finished with my prep list 4 hours early on my last day is an enduring moment of pride.</p>
<p>The cooks I worked with tended to pride themselves in being resourceful. Mario, the cook I worked directly under exemplified this. He'd order the line cooks to make us chilaquiles at the start of our 5am shift, cut plastic bags so that you could tie them shut with a twist, and stock up on the best hardware likely to be lost to the dishpit in a midday rush.</p>
<p>Oddly, restaurant jobs also gave me a love for utilitarian cooking equipment. My ideal kitchen is pretty much cambros, striped rags, and steel mixing bowls. Whenever things were really busy that level of simplicity was nearly necessary. Even since I stopped working in restaurants, I've been looking for the simplest versions of things and I think that's where that began.</p>
<p>On net, I always enjoyed working in restaurants despite how physically demanding it often was. There's few better jobs to let your mind spin while running through ambient tasks. I'm happily out of the restaurant industry, but doubt I will ever work with more interesting people in my life.</p>`
      },
      {
        title: "Working as a Caddie",
        date: "2026-04-30T18:30:00",
        body: `<p>Working as a golf caddie taught me to become a close study of emotions and to adapt my advice with them in mind. On meeting someone you'd bluntly assess: are they talkative, somber, open to reaching decisions collectively? Everything after would be a priori, incrementing off a shrug or smile given a suggestion. It's a pure service job, and I became a chameleon, adapting to hundreds of players.</p>
<p>In that way, the role taught me to be exceptionally perceptive. It was my job to know and see the things that weren't immediately obvious and be trusted for that insight. In more advanced matches you'd see risk and defend against it towards the middle of a green or short of a hazard. Any advice was never purely based on external conditions, but also the emotions gleaned from the player beside me.</p>
<p>In the best matches I felt I was verbalizing the next shot. Instructions to draw a 4 iron off the chimney of the white house would be followed by the ball arching beautifully in that direction. This narrow gap between advice and results was extremely rewarding. That direct feedback is something I deeply miss.</p>
<p>I also noticed that the people I instructed best, and who often performed the best, seemed to share a language with me. We looked at risks and opportunities similarly; my idea of how aggressively they would hit a shot was in line with how aggressively they actually did. Skill was a precursor for this, but the players who were most successful at executing were usually the most perceptive as well.</p>
<p>If there is some hard earned insight to this, it's that details are personal. Some trivial fact could be prized by a championship golfer. What might seem useless, the grain of the grass, the idiosyncratic schedules of the grounds crew, and the height of a creek can be conquered, dictated, and determine the fortunes of competition.</p>`
      },
      {
        title: "Mt. Tam",
        date: "2026-08-09T14:00:00",
        body: `<p>I'm always thinking of Mt. Tam. Of rushing through the Marina to cross the bridge. Camino Alto from Sausalito. The vaulted coffee shop with bad sandwiches. Crashing on Fairfax-Bolinas trying to clip-in.</p>
<p>Then summiting the golf course, catching glimpses of the conical hills and horses behind rusted fences. White-knuckling the handlebars zooming down to Alpine Dam. That exhausting climb around the neck of the lake before seven sisters on Ridgecrest.</p>
<p>And coming up to East Peak in the clouds. The spit of Stinson Beach jumping out of towering Redwood groves. Rows of sloping waves fade into the cloud layer, the bay hiding behind a hill to my left.</p>
<p>Then, laying off the pedals to the sound of the freehub and a headwind. The wheels captive to gravity and the dividing line.</p>`
      }
    ];

    const fmtFull = d => d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) +
      ' at ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const fmtShort = d => {
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      return (d.getMonth() + 1) + '/' + d.getDate() + '/' + String(d.getFullYear()).slice(-2);
    };
    const groupLabel = d => {
      const now = new Date();
      const DAY = 864e5;
      const startOf = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      const diff = startOf(now) - startOf(d);
      if (diff === 0) return 'Today';
      if (diff === DAY) return 'Yesterday';
      if (diff <= 7 * DAY) return 'Previous 7 Days';
      if (diff <= 30 * DAY) return 'Previous 30 Days';
      if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      return String(d.getFullYear());
    };
    const preview = html => {
      const t = document.createElement('div');
      t.innerHTML = html;
      return (t.textContent || '').replace(/\s+/g, ' ').trim();
    };

    const NOTES = ALL_NOTES.filter(n => !n.hidden);
    NOTES.forEach(n => n._d = new Date(n.date));
    NOTES.sort((a, b) => b._d - a._d);

    const app = document.getElementById('nx-app');
    const list = document.getElementById('nx-list');
    const content = document.getElementById('nx-content');

    let lastGroup = '';
    const rows = [];
    NOTES.forEach((note, i) => {
      const g = groupLabel(note._d);
      if (g !== lastGroup) {
        const gh = document.createElement('div');
        gh.className = 'nx-group';
        gh.textContent = g;
        list.appendChild(gh);
        lastGroup = g;
      }
      const row = document.createElement('div');
      row.className = 'nx-row';
      row.innerHTML = '<div class="nx-row-title"></div><div class="nx-row-sub"></div>';
      row.querySelector('.nx-row-title').textContent = note.title;
      row.querySelector('.nx-row-sub').textContent = fmtShort(note._d) + '  ' + preview(note.body);
      row.addEventListener('click', () => select(i));
      list.appendChild(row);
      rows.push(row);
    });

    function select(i) {
      const note = NOTES[i];
      rows.forEach((r, j) => r.classList.toggle('active', j === i));
      content.innerHTML =
        '<div class="nx-date"></div><div class="nx-title"></div><div class="nx-body"></div>';
      content.querySelector('.nx-date').textContent = fmtFull(note._d);
      content.querySelector('.nx-title').textContent = note.title;
      content.querySelector('.nx-body').innerHTML = note.body;
      app.classList.add('reading');           // mobile: show the note view
      document.getElementById('nx-pane').scrollTop = 0;
    }

    document.getElementById('nx-back').addEventListener('click', () => app.classList.remove('reading'));

    const sidebar = document.getElementById('nx-sidebar');
    const hideBtn = document.getElementById('nx-hide-btn');
    const showBtn = document.getElementById('nx-show-btn');
    hideBtn.addEventListener('click', () => {
      sidebar.classList.add('collapsed');
      showBtn.hidden = false;
    });
    showBtn.addEventListener('click', () => {
      sidebar.classList.remove('collapsed');
      showBtn.hidden = true;
    });

    if (NOTES.length) select(0);               // desktop: first note open by default
    app.classList.remove('reading');           // mobile still starts on the list
  })();
  </script>
</body>
</html>
